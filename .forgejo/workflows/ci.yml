name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Cache Rust toolchain
        id: rust-toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: ${{ runner.os }}-rust-toolchain-v2

      # Trust the binary, not `cache-hit`: a cache restored into the wrong
      # location (workspace/HOME drift between runners) still reports a hit.
      - name: Install Rust toolchain
        run: |
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "cargo present at $HOME/.cargo/bin/cargo"
          else
            echo "cargo missing after restore (cache-hit=${{ steps.rust-toolchain.outputs.cache-hit }})"
            echo "HOME=$HOME  GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            ls -la "$HOME/.cargo/bin" /root/.cargo/bin /github/home/.cargo/bin 2>&1 || true
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --component rustfmt --component clippy
          fi

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm --filter @kizunashelf/web exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kizunashelf/web exec playwright install chromium

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: cargo fmt --check
      - run: cargo clippy -p kizunashelf --all-targets -- -D warnings
      - run: pnpm test

      - name: Verify committed contract is in sync
        run: |
          pnpm contract:generate
          git diff --exit-code -- packages/api-contract openapi

      - name: Verify committed i18n catalogs are in sync
        run: |
          pnpm i18n:extract
          git diff --exit-code -- apps/web/src/locales

      - name: Verify committed generated reference docs are in sync
        run: |
          pnpm docs:generate
          git diff --exit-code -- manual/content/reference

      # Builds the app *and* the manual (Docusaurus), whose build fails on a
      # broken internal link or anchor.
      - run: pnpm build

  desktop-check:
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust toolchain
        id: rust-toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: ${{ runner.os }}-rust-toolchain-v2

      # Trust the binary, not `cache-hit`: a cache restored into the wrong
      # location (workspace/HOME drift between runners) still reports a hit.
      - name: Install Rust toolchain
        run: |
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "cargo present at $HOME/.cargo/bin/cargo"
          else
            echo "cargo missing after restore (cache-hit=${{ steps.rust-toolchain.outputs.cache-hit }})"
            echo "HOME=$HOME  GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            ls -la "$HOME/.cargo/bin" /root/.cargo/bin /github/home/.cargo/bin 2>&1 || true
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --component rustfmt --component clippy
          fi

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-tauri-v1

      - name: Install Tauri/GTK system libraries
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          cache-bin: false

      - name: Typecheck the desktop crate
        run: cargo check -p kizunashelf-desktop

  build-image:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      # node:lts has no Docker CLI; install the static client (cached, keyed on
      # the version) so login-action and build-push-action can drive the host
      # daemon (mounted via the runner's container.options).
      - name: Cache Docker CLI
        id: docker-cli
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/docker
          key: ${{ runner.os }}-docker-cli-29.5.3

      - name: Install Docker CLI
        if: steps.docker-cli.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.5.3.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker

      - uses: docker/setup-buildx-action@v4
        with:
          name: kiz-builder
          cleanup: false

      - uses: docker/login-action@v4
        with:
          registry: docker-registry.metagross.mudkip.me
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}:latest
            docker-registry.metagross.mudkip.me/${{ github.repository }}:${{ github.sha }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache,mode=max

  build-image-tag:
    needs: [check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      # node:lts has no Docker CLI; install the static client (cached, keyed on
      # the version) so login-action and build-push-action can drive the host
      # daemon (mounted via the runner's container.options).
      - name: Cache Docker CLI
        id: docker-cli
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/docker
          key: ${{ runner.os }}-docker-cli-29.5.3

      - name: Install Docker CLI
        if: steps.docker-cli.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.5.3.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker

      - uses: docker/setup-buildx-action@v4
        with:
          name: kiz-builder
          cleanup: false

      - uses: docker/login-action@v4
        with:
          registry: docker-registry.metagross.mudkip.me
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache,mode=max
