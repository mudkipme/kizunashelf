[package]
name = "kizunashelf-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0.99"
axum = "0.8.7"
kizunashelf = { path = "../../../crates/kizunashelf" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"

# Native OS secret managers for provider credentials + the token cache:
# macOS Keychain, Windows Credential Manager, and the Linux Secret Service
# (gnome-keyring / KWallet via D-Bus).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
