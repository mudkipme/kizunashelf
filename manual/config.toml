# KizunaShelf manual — Zola site configuration, using the Goyo theme (themes/goyo, git submodule).
# Build with `zola build`, preview with `zola serve` (both from this directory).

base_url = "https://kizunashelf.app"
title = "KizunaShelf Manual"
description = "The KizunaShelf user manual: concepts, cookbook recipes, guides, and the full schema reference."
theme = "goyo"

default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = false

[markdown]
bottom_footnotes = true

# Dual themes with the default inline style: colors use CSS light-dark(), no extra CSS files needed.
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
default_thumbnail = "images/og-image.png"
# Loads static/css/custom-main.css — pins code-block color-scheme to the goyo theme (see that file).
enable_custom_css = true

nav = [
    { name = "Manual", url = "/introduction", type = "url", icon = "book" },
]

[extra.logo]
text = "KizunaShelf"

[extra.lang]
rtl = []
aliases = { en = "English" }

[extra.theme]
colorset = "light"
brightness = "normal"
disable_toggle = false

[extra.sidebar]
expand_depth = 2
disable_root_hide = false
enable_desktop_menu = true

[extra.share]
copy_url = false
x = false
