[package]
name = "kizunashelf-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kizunashelf_ffi"
# `staticlib` is linked into the iOS xcframework; `cdylib` lets uniffi-bindgen
# read the interface metadata in library mode on the host; `lib` keeps the crate
# usable from Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# Standard uniffi-bindgen entry point so the build script can generate Swift
# bindings without a globally installed tool.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Mobile hosts inject a coordinated VFS, which deliberately does not expose
# native filesystem watching. This applies equally to iOS and a future Android
# host, so select it by dependency features rather than target-OS checks.
kizunashelf = { path = "../kizunashelf", default-features = false }
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
urlencoding = "2.1.3"
uniffi = { version = "0.32", features = ["cli", "tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
# Executor-agnostic `block_on`, mirroring how UniFFI drives the async export from
# a non-Tokio foreign executor (and avoiding a nested-runtime drop panic).
futures = "0.3"
