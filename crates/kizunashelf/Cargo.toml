[package]
name = "kizunashelf"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kizunashelf-api"
path = "src/bin/api.rs"

[[bin]]
name = "kizunashelf-schema"
path = "src/bin/schema.rs"

[[bin]]
name = "kizunashelf-docs"
path = "src/bin/docs.rs"

[features]
default = ["native-vfs-watch"]
# Enables recursive OS filesystem notifications for NativeVfs. In-process
# mobile hosts inject their own VFS and disable this feature; those backends use
# the trait's unsupported-by-default watch capability.
native-vfs-watch = ["dep:notify"]
# Off by default: env-var proxies (HTTP_PROXY/HTTPS_PROXY/…) are always honored
# regardless. This adds reading the OS-level system proxy on macOS/Windows (a
# no-op on Linux, so the Docker/web build is unaffected). Enabled by the desktop
# app; env vars still take precedence over the system config when both are set.
system-proxy = ["reqwest/system-proxy"]

[dependencies]
anyhow = "1.0.104"
aide = { version = "0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query"] }
async-trait = "0.1"
base64 = "0.23.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
httpdate = "1.0.3"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "rustls"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The original serde_yaml (dtolnay) is unmaintained/archived; yaml_serde is the
# YAML org's maintained, API-compatible fork. Renamed to `serde_yaml` so every
# `use serde_yaml::` import (and serde derive path) stays unchanged.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
# Facade only — the core never installs a subscriber. Each host decides where
# events go (the web binary and the desktop shell install one; iOS forwards to
# `OSLog`), and with no subscriber installed every event compiles to a no-op.
tracing = "0.1.44"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
notify = { version = "8.2.0", optional = true }

# Built-in password authentication belongs to the network-facing web runtime.
# Keep its hashing and terminal-prompt dependencies out of iOS core builds.
[target.'cfg(not(target_os = "ios"))'.dependencies]
argon2 = "0.6.0"
# Session-token randomness for the web auth layer (argon2 0.6 uses this for its
# password salts too).
getrandom = "0.4"
rpassword = "7.5.4"
# The subscriber the `kizunashelf-api` binary installs. iOS builds only need the
# `tracing` facade above, so keep the whole subscriber stack out of them.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.23.1"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
# test-util unlocks tokio::test(start_paused) for the request-pacing tests.
tokio = { version = "1.53.1", features = ["test-util"] }
