[package]
name = "kizunashelf"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kizunashelf-api"
path = "src/bin/api.rs"

[[bin]]
name = "kizunashelf-schema"
path = "src/bin/schema.rs"

[features]
# Off by default: env-var proxies (HTTP_PROXY/HTTPS_PROXY/…) are always honored
# regardless. This adds reading the OS-level system proxy on macOS/Windows (a
# no-op on Linux, so the Docker/web build is unaffected). Enabled by the desktop
# app; env vars still take precedence over the system config when both are set.
system-proxy = ["reqwest/system-proxy"]

[dependencies]
anyhow = "1.0.100"
aide = { version = "0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query"] }
async-trait = "0.1"
base64 = "0.22.1"
axum = "0.8.7"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
icu_collator = "2.2.0"
icu_locale_core = "2.2.0"
quick-xml = "0.39.4"
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "rustls"] }
schemars = { version = "1.1.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.12"
serde_json = { version = "1.0.147", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
unicode-normalization = "0.1.24"
urlencoding = "2.1.3"

[dev-dependencies]
base64 = "0.22.1"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
