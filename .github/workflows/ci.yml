name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tests and generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kizunashelf/web exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: cargo fmt --check
      - run: cargo clippy -p kizunashelf --all-targets --locked -- -D warnings
      - run: cargo test -p kizunashelf -p kizunashelf-ffi --locked
      - name: Verify generated API contract
        run: |
          pnpm contract:generate
          git diff --exit-code -- packages/api-contract
      - name: Verify translation catalogs
        run: |
          pnpm i18n:extract
          git diff --exit-code -- apps/web/src/locales
      - name: Verify generated reference docs
        run: |
          pnpm docs:generate
          git diff --exit-code -- manual/content/reference
      - run: pnpm build
      - name: Upload website and manual
        if: >-
          github.repository == 'mudkipme/kizunashelf' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: manual/build

  desktop-check:
    name: Desktop compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - run: cargo check -p kizunashelf-desktop --locked

  docker-check:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kizunashelf:ci
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,scope=container-amd64,mode=max
      - name: Start the image and check the web UI and API
        run: |
          mkdir -p "$RUNNER_TEMP/vault"
          docker run -d --name kizunashelf-smoke \
            -p 127.0.0.1:8787:8787 \
            -v "$RUNNER_TEMP/vault:/vault" \
            -e KIZUNASHELF_CONTENT_WRITABLE=true \
            -e KIZUNASHELF_SETTINGS_WRITABLE=true \
            kizunashelf:ci
          trap 'docker logs kizunashelf-smoke; docker rm -f kizunashelf-smoke' EXIT
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8787/api/settings/config
          curl --fail http://127.0.0.1:8787/ -o "$RUNNER_TEMP/index.html"
          test -s "$RUNNER_TEMP/index.html"
          grep -q 'id="root"' "$RUNNER_TEMP/index.html"
          curl --fail -X PUT -H 'Content-Type: application/json' \
            --data '{"vault":{"taxonomyRoot":"Taxonomy","types":[]}}' \
            http://127.0.0.1:8787/api/settings/config
          curl --fail http://127.0.0.1:8787/api/health

  build-image:
    name: Build GHCR image (${{ matrix.arch }})
    needs: [check, desktop-check, docker-check]
    if: >-
      github.repository == 'mudkipme/kizunashelf' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/mudkipme/kizunashelf
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/mudkipme/kizunashelf,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-image:
    name: Publish GHCR image
    needs: [build-image]
    if: >-
      github.repository == 'mudkipme/kizunashelf' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/mudkipme/kizunashelf
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Combine native images and publish tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ghcr.io/mudkipme/kizunashelf
          IMAGE_TAGS_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION"

  deploy-pages:
    name: Publish website and manual
    needs: [check]
    if: >-
      github.repository == 'mudkipme/kizunashelf' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
