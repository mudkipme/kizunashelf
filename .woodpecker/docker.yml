steps:
  check:
    image: rust:1-alpine
    commands:
      - apk add --no-cache build-base ca-certificates nodejs npm git
      - npm install -g pnpm@10.28.0
      - pnpm install --frozen-lockfile
      - pnpm lint
      - pnpm typecheck
      - cargo fmt --check
      - cargo clippy -p kizunashelf --all-targets -- -D warnings
      - pnpm test
      # Fail if the committed OpenAPI contract drifts from the schema.
      - pnpm contract:generate
      - git diff --exit-code -- packages/api-contract openapi
      - pnpm build

  desktop-check:
    image: rust:1-bookworm
    commands:
      # Tauri/GTK system libraries required to typecheck the desktop crate.
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
        libxdo-dev libssl-dev libayatana-appindicator3-dev
      - cargo check -p kizunashelf-desktop

  docker:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.metagross.mudkip.me
      repo: docker-registry.metagross.mudkip.me/${CI_REPO_OWNER}/${CI_REPO_NAME}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: nexus_username
      password:
        from_secret: nexus_password
      mtu: 1300
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

  docker-tag:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.metagross.mudkip.me
      repo: docker-registry.metagross.mudkip.me/${CI_REPO_OWNER}/${CI_REPO_NAME}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - ${CI_COMMIT_TAG}
      username:
        from_secret: nexus_username
      password:
        from_secret: nexus_password
      mtu: 1300
    when:
      - event: tag
