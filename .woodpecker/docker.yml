steps:
  check:
    image: rust:1-alpine
    commands:
      - apk add --no-cache build-base ca-certificates nodejs npm
      - npm install -g pnpm@10.28.0
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm build

  docker:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.metagross.mudkip.me
      repo: docker-registry.metagross.mudkip.me/${CI_REPO_OWNER}/${CI_REPO_NAME}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: nexus_username
      password:
        from_secret: nexus_password
      mtu: 1350
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

  docker-tag:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.metagross.mudkip.me
      repo: docker-registry.metagross.mudkip.me/${CI_REPO_OWNER}/${CI_REPO_NAME}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - ${CI_COMMIT_TAG}
      username:
        from_secret: nexus_username
      password:
        from_secret: nexus_password
      mtu: 1350
    when:
      - event: tag
