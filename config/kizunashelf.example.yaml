# App config — stored on this machine (e.g. ~/.config/kizunashelf.yaml).
# Describes where the vault lives and how this machine runs the app. It is NOT
# synced with the vault. The vault's content schema (taxonomy, assets, types,
# home, daily notes) lives separately inside the vault at
# <vaultRoot>/.kizunashelf/config.yaml — see vault-config.example.yaml.
vaultRoot: /path/to/ObsidianVault
contentWritable: true
# Operational tuning knob (not editable from the Settings UI). Set here or via
# the KIZUNASHELF_READ_CONCURRENCY env var, which takes precedence when present.
readConcurrency: 8
